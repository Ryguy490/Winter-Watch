kind = "web"
previewPath = "/"
title = "Winter Watch Kanata"
version = "1.0.0"
id = "artifacts/winter-watch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21173

[services.development]
run = "pnpm --filter @workspace/winter-watch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/winter-watch", "run", "build" ]
publicDir = "artifacts/winter-watch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21173"
BASE_PATH = "/"
